name: EAS Deploy

on:
  push:
    branches:
      - main # Change this if your default branch is different

jobs:
  deploy:
    name: EAS Update
    runs-on: ubuntu-latest

    steps:
      - name: 🏗 Setup repo
        uses: actions/checkout@v4

      - name: 🏗 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18.x # Use your required Node version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: 🏗 Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: 📦 Install dependencies
        run: npm ci

      # This step creates an Over-The-Air (OTA) update via EAS Update. 
      # It's faster than a full build and perfect for JS/Asset changes.
      - name: 🚀 Publish EAS Update
        run: eas update --auto --non-interactive

      # If you need to trigger a full binary build (e.g. for native code changes) 
      # you can uncomment the following step:
      # - name: 🏗 Create EAS Build
      #   run: eas build --platform all --profile production --non-interactive
